<!doctype html>
<!--
  Minimized chatgpt.com structure, from a DOM capture on 2026-10-27 (PL UI).
  Only the attributes the adapter relies on are kept; all conversation content, the sidebar and
  account data are removed. A small script imitates ChatGPT's send behaviour.
-->
<html lang="pl">
  <head><meta charset="utf-8" /><title>ChatGPT (fixture)</title></head>
  <body>
    <!-- Inactive page kept in the DOM, like the real app: must be ignored -->
    <div class="contents" data-app-shell-active-page="false">
      <div style="display: none !important">
        <main>
          <div data-turn-key="old-1">
            <div data-user-message-bubble="true"><div>stara rozmowa</div></div>
          </div>
          <form data-chatgpt-composer="" data-composer-placement="thread">
            <div data-composer-input=""><div contenteditable="true" class="ProseMirror" role="textbox"><p>ukryte</p></div></div>
            <button type="submit" aria-label="Wyślij">send</button>
          </form>
        </main>
      </div>
    </div>

    <div class="contents" data-app-shell-active-page="true">
      <main>
        <div id="thread"></div>
        <form id="composer" data-chatgpt-composer="" data-composer-placement="thread">
          <div data-composer-attachments="" hidden=""></div>
          <div data-composer-input="">
            <div id="prompt" contenteditable="true" class="ProseMirror" role="textbox" aria-label="Zapytaj ChatGPT"><p><br /></p></div>
          </div>
          <div id="primary"><button id="send" type="submit" aria-label="Wyślij">send</button></div>
        </form>
      </main>
    </div>

    <script>
      const prompt = document.getElementById('prompt');
      const form = document.getElementById('composer');
      const thread = document.getElementById('thread');
      const primary = document.getElementById('primary');
      let turns = 0;
      window.__editSaved = false;
      // Edit editor inside a turn: Enter saves the edit.
      document.addEventListener('keydown', (e) => {
        if (e.target.closest && e.target.closest('.edit-input') && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          window.__editSaved = true;
        }
      });

      // Like ProseMirror: Enter submits, Shift+Enter inserts a newline.
      prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = prompt.innerText.trim();
        if (!text) return;
        turns++;
        const turn = document.createElement('div');
        turn.dataset.turnKey = 't' + turns;
        turn.innerHTML =
          '<div data-user-message-bubble="true"><div class="text"></div></div>' +
          // Inline edit editor inside the turn, reusing composer markup (must never be intercepted)
          '<form data-chatgpt-composer="" class="edit"><div data-composer-input=""><div contenteditable="true" class="ProseMirror edit-input"><p>edit</p></div></div><button type="submit">Zapisz</button></form>' +
          '<div data-markdown-text-style="assistant-message"></div>';
        turn.querySelector('.text').textContent = text;
        thread.appendChild(turn);
        prompt.innerHTML = '<p><br></p>';
        primary.innerHTML = '<button type="button" aria-label="Zatrzymaj">stop</button>';
        setTimeout(() => {
          turn.querySelector('[data-markdown-text-style]').textContent = 'odpowiedź';
          primary.innerHTML = '<button id="send" type="submit" aria-label="Wyślij">send</button>';
        }, 400);
      });
    </script>
  </body>
</html>
