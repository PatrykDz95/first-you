<!doctype html>
<!--
  Minimized gemini.google.com structure, from a DOM capture on 2026-10-28 (PL UI).
  Only the elements and attributes the adapter relies on are kept; conversation content, sidebar and
  account data are removed. A small script imitates Gemini's send behaviour.
-->
<html lang="pl">
  <head><meta charset="utf-8" /><title>Gemini (fixture)</title></head>
  <body>
    <main>
      <div id="thread"></div>
      <fieldset role="none" class="input-area-fieldset">
        <div class="text-input-field">
          <div class="attachment-preview-wrapper"></div>
          <div class="text-input-field_textarea-wrapper">
            <rich-textarea class="text-input-field_textarea ql-container ql-bubble">
              <div id="prompt" class="ql-editor textarea" contenteditable="true" role="textbox"
                   aria-label="Wpisz prompta dla Gemini"><p><br /></p></div>
              <div class="ql-clipboard" contenteditable="true" tabindex="-1"></div>
            </rich-textarea>
          </div>
          <div class="trailing-actions-wrapper">
            <speech-dictation-mic-button><button aria-label="Dyktuj">mic</button></speech-dictation-mic-button>
            <div data-test-id="send-button-container" class="send-button-container visible">
              <gem-icon-button class="send-button has-input submit">
                <button id="send" aria-label="Wyślij wiadomość"><mat-icon fonticon="arrow_upward">↑</mat-icon></button>
              </gem-icon-button>
            </div>
          </div>
        </div>
      </fieldset>
    </main>
    <script>
      const prompt = document.getElementById('prompt');
      const thread = document.getElementById('thread');
      window.__editSaved = false;

      function send() {
        const text = prompt.innerText.trim();
        if (!text) return;
        const q = document.createElement('user-query');
        q.innerHTML =
          '<div class="query-content"><div class="query-text"></div>' +
          // Edit box inside <user-query> (must never be intercepted)
          '<textarea class="edit-input" aria-label="Edytuj">edit</textarea></div>';
        q.querySelector('.query-text').textContent = text;
        const r = document.createElement('model-response');
        r.innerHTML = '<message-content><div class="markdown"><p>odpowiedź</p></div></message-content>';
        thread.append(q, r);
        prompt.innerHTML = '<p><br></p>';
      }

      // Like Quill in Gemini: Enter sends, Shift+Enter inserts a newline.
      prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      document.getElementById('send').addEventListener('click', send);
      document.addEventListener('keydown', (e) => {
        if (e.target.closest && e.target.closest('.edit-input') && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          window.__editSaved = true;
        }
      });
    </script>
  </body>
</html>
